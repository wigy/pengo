<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071C3C">
<title>Pengo</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #071C3C;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="game" role="img" tabindex="0"
  aria-label="Pengo game. Move with the arrow keys, push blocks with the space bar."></canvas>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/main.js"></script>
</body>
</html>
